<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>XENON CLAN — Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06070a;
  --border:#1a1f2e;
  --border-2:#262c3f;
  --text:#eef0f6;
  --text-dim:#98a0b5;
  --text-mute:#565c70;
  --accent:#5865F2;
  --accent-2:#7d8cff;
  --accent-3:#a8b4ff;
  --green:#3ba55d;
  --green-2:#4dd17a;
  --amber:#f0a020;
  --shadow-lg:0 40px 100px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.011em;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    calc(40px + env(safe-area-inset-top))
    calc(20px + env(safe-area-inset-right))
    calc(40px + env(safe-area-inset-bottom))
    calc(20px + env(safe-area-inset-left));
  overflow-x:hidden;
  position:relative;
}

/* ── Ambient background ───────────────── */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient::before{
  content:'';
  position:absolute;
  top:-30%;left:-10%;right:-10%;height:80%;
  background:
    radial-gradient(ellipse 60% 50% at 30% 30%,rgba(88,101,242,.30),transparent 60%),
    radial-gradient(ellipse 50% 40% at 75% 20%,rgba(125,140,255,.20),transparent 65%);
  filter:blur(60px);
  animation:drift 30s ease-in-out infinite alternate;
}
.ambient::after{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(125,140,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(125,140,255,.04) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 800px 600px at 50% 25%,#000 10%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse 800px 600px at 50% 25%,#000 10%,transparent 70%);
}
@keyframes drift{
  0%{transform:translate3d(0,0,0) rotate(0deg)}
  100%{transform:translate3d(3%,-4%,0) rotate(2deg)}
}

/* ── Noise overlay for depth ────────────── */
.noise{
  position:fixed;inset:0;pointer-events:none;z-index:1;
  opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

.wrap{width:100%;max-width:580px;position:relative;z-index:2}

/* ── Card ───────────────────────────────── */
.card{
  background:linear-gradient(180deg,rgba(20,24,36,.9) 0%,rgba(12,15,24,.95) 100%);
  border:1px solid var(--border);
  border-radius:24px;
  padding:44px 40px 34px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 -1px 0 rgba(0,0,0,.5) inset,
    var(--shadow-lg),
    0 0 0 1px rgba(0,0,0,.5);
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:15%;right:15%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,180,255,.9),transparent);
  filter:blur(.3px);
}
.card::after{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:24px;
  padding:1px;
  background:linear-gradient(160deg,rgba(125,140,255,.25),transparent 35%,transparent 65%,rgba(88,101,242,.15));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}

/* ── Brand strip ────────────────────────── */
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:26px;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--text-mute);
}
.brand::before,.brand::after{
  content:'';
  flex:1;
  max-width:70px;
  height:1px;
}
.brand::before{background:linear-gradient(90deg,transparent,rgba(125,140,255,.6))}
.brand::after{background:linear-gradient(90deg,rgba(125,140,255,.6),transparent)}
.brand-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent-2);
  box-shadow:0 0 12px var(--accent-2),0 0 4px var(--accent-3);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.82)}
}

/* ── Hero / avatar ──────────────────────── */
.hero{text-align:center;margin-bottom:30px}
.avatar-wrap{
  position:relative;
  width:112px;
  height:112px;
  margin:0 auto 22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.avatar-halo{
  position:absolute;
  inset:-24px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(88,101,242,.55) 0%,rgba(125,140,255,.15) 40%,transparent 70%);
  filter:blur(16px);
  animation:haloPulse 4s ease-in-out infinite;
}
@keyframes haloPulse{
  0%,100%{opacity:.65;transform:scale(1)}
  50%{opacity:1;transform:scale(1.1)}
}
.avatar-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  padding:2px;
  background:conic-gradient(from 0deg,var(--accent) 0%,var(--accent-3) 30%,var(--accent) 60%,var(--accent-2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:ringSpin 6s linear infinite;
  filter:drop-shadow(0 0 12px rgba(125,140,255,.6));
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.avatar-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  position:relative;
  z-index:1;
  background:#141824;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #0c0f18;
}
.avatar{
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering:pixelated;
  display:block;
}
.avatar-badge{
  position:absolute;
  bottom:2px;
  right:2px;
  width:32px;
  height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:3.5px solid #0c0f18;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  box-shadow:0 6px 20px rgba(88,101,242,.65);
}
.avatar-badge svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.035em;
  color:#fff;
  line-height:1.1;
  margin-bottom:8px;
  background:linear-gradient(180deg,#fff 0%,#c5cae8 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.tagline{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  padding:5px 12px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--border);
  border-radius:999px;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.tagline .sep{color:var(--text-mute);opacity:.7}
.tagline .hl{
  color:var(--accent-3);
  font-weight:700;
}

/* ── Stats ──────────────────────────────── */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:28px 0 26px;
}
.stat{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.005));
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 10px;
  text-align:center;
  position:relative;
  overflow:hidden;
  transition:border-color .25s,transform .2s;
}
.stat:hover{
  border-color:rgba(125,140,255,.35);
  transform:translateY(-1px);
}
.stat::before{
  content:'';
  position:absolute;
  top:0;left:20%;right:20%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,180,255,.5),transparent);
}
.stat-val{
  font-size:18px;
  font-weight:800;
  color:#fff;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.025em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}
.stat-val.on{color:var(--green-2)}
.stat-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--green-2);
  box-shadow:0 0 10px var(--green-2);
  animation:pulse 1.8s ease-in-out infinite;
}
.stat-lbl{
  font-size:9.5px;
  color:var(--text-mute);
  text-transform:uppercase;
  letter-spacing:0.14em;
  margin-top:6px;
  font-weight:700;
}

/* ── Notice ─────────────────────────────── */
.notice{
  background:linear-gradient(135deg,rgba(88,101,242,.08),rgba(88,101,242,.02));
  border:1px solid rgba(88,101,242,.2);
  border-radius:14px;
  padding:18px 20px;
  font-size:13.5px;
  line-height:1.65;
  color:var(--text-dim);
  margin-bottom:26px;
  position:relative;
  overflow:hidden;
}
.notice::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  box-shadow:0 0 20px rgba(88,101,242,.6);
}
.notice b{
  color:#fff;
  font-weight:700;
  display:block;
  margin-bottom:5px;
  font-size:14px;
  letter-spacing:-0.015em;
}

/* ── Button ─────────────────────────────── */
.btn{
  width:100%;
  background:linear-gradient(180deg,#6c78ff 0%,var(--accent) 45%,#4550d4 100%);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:17px 22px;
  font-size:15.5px;
  font-weight:700;
  font-family:inherit;
  letter-spacing:0.005em;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .15s cubic-bezier(.2,.8,.3,1),box-shadow .3s;
  box-shadow:
    0 1px 0 rgba(255,255,255,.25) inset,
    0 -1px 0 rgba(0,0,0,.25) inset,
    0 12px 36px rgba(88,101,242,.42),
    0 3px 8px rgba(0,0,0,.35);
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.3) inset,
    0 -1px 0 rgba(0,0,0,.25) inset,
    0 18px 48px rgba(88,101,242,.55),
    0 3px 8px rgba(0,0,0,.35);
}
.btn:active{transform:translateY(0) scale(.985)}
.btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.22) 50%,transparent 75%);
  transform:translateX(-100%);
  pointer-events:none;
}
.btn.shine::before{animation:btnShine 1.1s ease}
@keyframes btnShine{to{transform:translateX(100%)}}
.btn-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  position:relative;
  z-index:1;
}
.btn svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
}

/* ── Trust strip ────────────────────────── */
.trust{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:11px;
  color:var(--text-mute);
  margin-top:22px;
  padding-top:22px;
  border-top:1px solid var(--border);
  letter-spacing:0.005em;
}
.trust svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.trust b{color:var(--text-dim);font-weight:600}
.trust .sep{opacity:.5}

.page-foot{
  text-align:center;
  font-size:11px;
  color:var(--text-mute);
  margin-top:26px;
  letter-spacing:0.02em;
}
.page-foot .sep{opacity:.4;margin:0 6px}

/* ── Modal ──────────────────────────────── */
.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(2,3,6,.88);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  align-items:center;
  justify-content:center;
  padding:
    calc(20px + env(safe-area-inset-top))
    calc(20px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom))
    calc(20px + env(safe-area-inset-left));
  z-index:9999;
  overflow-y:auto;
}
.modal-bg.show{display:flex;animation:bgIn .3s ease}
@keyframes bgIn{from{opacity:0}to{opacity:1}}

.modal{
  background:linear-gradient(180deg,rgba(20,24,36,.98) 0%,rgba(12,15,24,.99) 100%);
  border:1px solid var(--border);
  border-radius:20px;
  max-width:540px;
  width:100%;
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 50px 120px rgba(0,0,0,.9),
    0 0 0 1px rgba(0,0,0,.7);
  animation:modalIn .42s cubic-bezier(.2,.8,.3,1);
  overflow:hidden;
  position:relative;
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(28px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.modal::before{
  content:'';
  position:absolute;
  top:0;left:12%;right:12%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,180,255,.9),transparent);
}
.modal-progress{
  height:3px;
  background:rgba(255,255,255,.05);
  position:relative;
  overflow:hidden;
}
.modal-progress-bar{
  position:absolute;
  left:0;top:0;bottom:0;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));
  border-radius:0 3px 3px 0;
  transition:width .6s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 0 16px rgba(125,140,255,.8);
}

.modal-body{padding:28px 28px 24px}
.modal-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:8px;
}
.modal-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:linear-gradient(135deg,rgba(88,101,242,.25),rgba(88,101,242,.08));
  border:1px solid rgba(88,101,242,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(88,101,242,.3);
}
.modal-icon::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 28% 28%,rgba(168,180,255,.55),transparent 65%);
}
.modal-icon svg{
  width:24px;
  height:24px;
  stroke:var(--accent-3);
  stroke-width:2.3;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 0 6px rgba(168,180,255,.7));
}
.modal h2{
  font-size:20px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.025em;
  line-height:1.2;
}
.modal-status{
  font-size:11.5px;
  color:var(--text-mute);
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:500;
}
.modal-status .dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--green-2);
  box-shadow:0 0 8px var(--green-2);
  animation:pulse 1.8s ease-in-out infinite;
}
.modal-sub{
  font-size:13px;
  color:var(--text-dim);
  line-height:1.6;
  margin:16px 0 22px;
  padding:13px 15px;
  background:rgba(255,255,255,.022);
  border:1px solid var(--border);
  border-radius:11px;
}
.modal-sub.ok{
  border-color:rgba(59,165,93,.3);
  background:rgba(59,165,93,.07);
  color:#b5e8c3;
}

.steps-h{
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:0.16em;
  color:var(--text-mute);
  font-weight:800;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:12px;
}
.steps-h::after{
  content:'';
  flex:1;
  height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
}

.step{
  display:none;
  gap:13px;
  align-items:flex-start;
  padding:15px 17px;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:9px;
  font-size:13px;
  line-height:1.6;
  color:var(--text-dim);
  position:relative;
  overflow:hidden;
}
.step.show{display:flex;animation:stepIn .5s cubic-bezier(.2,.8,.3,1)}
@keyframes stepIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.step::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:2.5px;
  background:linear-gradient(180deg,var(--accent-2),var(--accent-3));
  opacity:0;
  transition:opacity .35s;
  box-shadow:0 0 12px rgba(125,140,255,.7);
}
.step.show::before{opacity:1}
.num{
  flex-shrink:0;
  width:28px;
  height:28px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-size:12.5px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:1px;
  box-shadow:0 5px 14px rgba(88,101,242,.45),0 1px 0 rgba(255,255,255,.2) inset;
}
.step-body{flex:1;min-width:0}
.step-body b{
  color:#fff;
  display:block;
  margin-bottom:5px;
  font-size:13.5px;
  font-weight:700;
  letter-spacing:-0.012em;
}
.step code{
  background:rgba(0,0,0,.55);
  border:1px solid var(--border-2);
  border-radius:5px;
  padding:1.5px 7px;
  font-family:'JetBrains Mono',Consolas,monospace;
  font-size:11.5px;
  color:#8ef0a4;
  margin:0 2px;
  font-weight:500;
  letter-spacing:-0.01em;
}

.modal-warn{
  background:linear-gradient(180deg,rgba(240,160,32,.10),rgba(240,160,32,.03));
  border:1px solid rgba(240,160,32,.25);
  border-radius:11px;
  padding:13px 15px;
  font-size:12px;
  line-height:1.6;
  color:#e0bd82;
  margin-top:16px;
  display:flex;
  gap:11px;
  align-items:flex-start;
}
.modal-warn svg{
  width:16px;height:16px;
  stroke:#f0a020;
  fill:none;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
  margin-top:1px;
  filter:drop-shadow(0 0 6px rgba(240,160,32,.5));
}

.modal-close{
  width:100%;
  background:linear-gradient(180deg,#6c78ff 0%,var(--accent) 100%);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:15px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:inherit;
  margin-top:20px;
  transition:transform .15s,box-shadow .25s;
  box-shadow:0 10px 28px rgba(88,101,242,.4),0 1px 0 rgba(255,255,255,.22) inset;
  letter-spacing:0.005em;
}
.modal-close:hover{transform:translateY(-1.5px);box-shadow:0 16px 40px rgba(88,101,242,.55),0 1px 0 rgba(255,255,255,.22) inset}
.modal-close:active{transform:translateY(0) scale(.985)}

.ticker{
  display:flex;
  align-items:center;
  gap:9px;
  padding:11px 13px;
  background:rgba(0,0,0,.35);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:11.5px;

  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}
.ticker svg{
  width:14px;
  height:14px;
  stroke:var(--green-2);
  fill:none;
  stroke-width:2.4;
  flex-shrink:0;
  position:relative;
  z-index:1;
  filter:drop-shadow(0 0 4px rgba(77,209,122,.5));
}
.ticker-text{
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  position:relative;
  z-index:1;

.ticker-text .u{color:#fff;font-weight:700}
.ticker-text .t{color:var(--text-mute)}
